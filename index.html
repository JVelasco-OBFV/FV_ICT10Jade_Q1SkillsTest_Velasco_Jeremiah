<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1SkillsTest</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Ink:wght@100..900&family=Bitcount+Prop+Single:wght@100..900&family=Bungee+Tint&family=Funnel+Display:wght@300..800&family=GFS+Didot&family=Limelight&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Questrial&display=swap" rel="stylesheet">

    <!--
        <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
        <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

        <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
        <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    -->
<style>
    body{
        background: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTCX3ukLe6nOmWq8EtQp4AGDJ--3RSnz6ExnIXhJitcQ3OcFczaYWxr8VRB&s=10');
        background-size: cover;
    }
    h1{
        background-color: white;
        border-style: double;
        border-color: green;
        border-width: 10px;
        text-align: center;
        color: brown;
        font-family: Bungee Tint, sans;
    }
    #ordering{
        background-color: rgb(255, 253, 253);
        text-align: center;
        padding: 40px;
        width: 400px;
        border-radius: 30px;
        margin-top: 40px;
        box-shadow: 0 0 10px 2px rgb(0, 0, 0);
        font-family: Agency FB;
        font-size: 20px;
    }
    #output1{
        font-family: Cascadia Code;
        font-weight: bold;
        font-size: 20px;
    }
    #output2{
        font-family: Cascadia Code;
        font-size: 17px;
    }
</style>
</head>
<body>
    <h1>Papa Jeff's Pizza</h1>
    <div id="ordering" class="container">
    <form action="">
        <p><b>Pizzas:</b></p>
        <select id="prod1" class="form-control" style="font-size: 18px;">
            <option value="0">Select an option</option>
            <option value="99">Pepperoni & Cheese (Php 99)</option>
            <option value="109">Hawaiian (Php 109)</option>
            <option value="119">Hawaiian w/ Bacon (Php 119)</option>
            <option value="129">Classic Combo (Php 129)</option>
            <option value="129">Cream Cheese and Spinach (Php 129)</option>
            <option value="139">Garlic Shrimp (Php 139)</option>
        </select>
        <br>
        <input type="radio" id="slice" value=0 name="size">
        <label for="regular">Slice (+Php 0)</label>
        <br>
        <input type="radio" id="box" value=180 name="size">
        <label for="upsize">Solo Box (+Php 180)</label>
        <br>
        <input type="radio" id="family" value=220 name="size">
        <label for="upsize">Family Size (+Php 220)</label>
        <br><br>
        <p><b>Beverages:</b></p>
        <select id="prod2" class="form-control" style="font-size: 18px;">
            <option value="0">Select an option</option>
            <option value="89">Chocolate Smoothie (Php 89)</option>
            <option value="89">Banana Smoothie (Php 89)</option>
            <option value="89">Watermelon Smoothie (Php 89)</option>
            <option value="89">Ube Smoothie (Php 89)</option>
            <option value="99">Strawberry Milkshake (Php 99)</option>
            <option value="99">Mocha Milkshake (Php 99)</option>
        </select>
        <br>
        <button type="button" py-click="show_order" class="btn btn-outline-success">Show Order</button>
    </form>
    <br>
    <div id="output1"></div>
    <br>
    <div id="output2"></div>
    <script type="py" src="main.py"></script>
    </div>
</body>
</html>
